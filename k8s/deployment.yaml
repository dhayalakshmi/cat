# Sets 4, 6 (replicas), 7 (image update), 13 (rolling update)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-app
spec:
  replicas: 1          # Set 6: change to 3
  selector:
    matchLabels:
      app: java-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: java-app
    spec:
      containers:
        - name: java-app
          image: admin/java-k8s-app:v1
          ports:
            - containerPort: 8080
